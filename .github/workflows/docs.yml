name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer commit supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # docfx is pinned in .config/dotnet-tools.json, so the site is reproducible.
      - run: dotnet tool restore

      # The library builds without any Roland-derived data; only the effects need it at run time,
      # and documentation generation never runs the engine.
      - run: dotnet docfx docs/docfx.json --warningsAsErrors

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
